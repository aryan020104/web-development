<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>\
    <style>
        /* class */
        div{
            background-color: black;
        }
        .red{
            color: aliceblue0;
        }
        /* ID */
        #green{
            color: darkblue;
        }  

        /* Descendant Selector */
        div p {
            color: azure;
            background-color: brown;
        }
    </style>
</head>
<body>
    <div class="red">  
        I am div
    </div>
    <div id="green">
        I am op 
    </div>
</body>
</html>
