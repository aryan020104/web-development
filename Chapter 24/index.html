<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
    <style>
        .box {
            box-shadow: 5px 15px 15px red;
            border: 2px solid black;
        }
        .text-element{
            text-shadow: 5px 5px 15px red;
            outline: 2px solid black;
        }
    </style>

</head>

<body>
    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Nam impedit blanditiis velit perspiciatis, natus,
        dolores eligendi commodi quibusdam rem voluptatum, iusto iure temporibus repudiandae unde corporis rerum in
        fugit? Inventore?
    </p>
    <div class="box">
        I am a box
    </div>
</body>

</html>
