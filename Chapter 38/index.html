<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .container {
            border: 2px solid black;
            display: flex;
            height: 80vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            flex-flow: row wrap;
            gap: 10px 20px;
        }

        .item {
            height: 92px;
            width: 92px;
            background-color: aqua;
        }

        .order-1 {
            order: 1;

        }

        .order-2 {
            order: 2;

        }

        .order-3 {
            order: 3;

        }


        .item1 {
            flex-grow: 2px;
            flex-shrink: 2px;
            align-self: flex-end;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item">1</div>
        <div class="item"></div>
        <div class="item order-3">3</div>
        <div class="item order-1"></div>
        <div class="item">5</div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>

    </div>

</body>

</html>
