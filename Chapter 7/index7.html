<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h1>Form to apply for OnlyFans</h1>
    <form action="post"></form>
    <div>
        <label for="Username">Enter your Username</label>
        <input type="text" name="Username" placeholder="Enter your Username">
       
    </div>
    <div>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female </label>
    </div>  
    
    <div>
        <input type="checkbox" name="subscribe" id="subscribe" value="yes">
        <label for="subscribe">Subscribe to Onlyfans!</label>
    </div>

    <div>
        <label for="comment">Enter your Experience:</label>
        <br>
        <textarea name="comment" id="comment" cols="30" rows="10"></textarea>
    </div>

    <div>
        <select name="Experience" id="">
            <option value="fully-experinced">Fully-experinced</option>
            <option value="semi-experinced">Semi-experinced</option>
            <option value="no-experince">No-experince</option>
        </select>  
    </div>
</body>
</html>
