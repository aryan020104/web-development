<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Styling</title>
    <Style>
        nav ul li{
            list-style:georgian;
            list-style-position: inside;
            background-color: yellow;
            border: 2px solid black;
            list-style-type:circle ;
        }
    </Style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
</body>
</html>
