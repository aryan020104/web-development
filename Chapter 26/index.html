<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1, initial-scale=1.0">
    <title>Scroll bar</title>
    <style>
        .box{
            width: 30vw;
            height: 10vh;
            border: 2px solid black;
            overflow:scroll;
            white-space: nowrap;
            text-overflow: ellipsis;
            overflow-x: auto;
            overflow-y: hidden;
        }

    </style>
</head>

<body>
    <div class="box">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Reiciendis consequatur porro placeat iure ea veritatis
        magni! Accusamus similique illum quos eum necessitatibus obcaecati quam quo aliquid fugiat optio, ut alias.
    </div>
</body>

</html>
