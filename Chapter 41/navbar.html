<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar with flexbox</title>
    <style>
        .logo {
            width: 40px;
            height: 23px;
            margin-top: 5px;
        }

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .right ul {
            display: flex;
            gap: 34px;
        }

        .right ul li {
            list-style: none;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo"><img src="UE-Logo-1.webp">
            </div>
            <div class="right">
                <ul>
                    <li><span>Products ˅ </span> <svg width="18" height="18" viewnbo="0 0 24" fill="none"> </svg> </li>
                    <li><span>Pricing ˅</span><svg width="18" height="18" viewnbo="0 0 24" fill="none"> </svg></li>
                    <li><span>Resources ˅</span><svg width="18" height="18" viewnbo="0 0 24" fill="none"> </svg></li>
                    <li><span>About us ˅</span><svg width="18" height="18" viewnbo="0 0 24" fill="none"> </svg> </li>
                    <li><img src="lan.png" height="20px"></li>
                </ul>

            </div>

        </nav>
    </header>

</body>

</html>
